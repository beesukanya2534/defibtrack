# Keeps the Supabase free-tier project from being auto-paused after ~7 days
# of inactivity, and restores it automatically if it got paused anyway. The
# app is only used about once a month, so without this the database is often
# paused when people open it to enter data.
#
# Auto-restore needs a repository secret SUPABASE_ACCESS_TOKEN (a Supabase
# personal access token). Without it the restore step is skipped with a
# warning and the rest of the workflow still runs.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 2 */3 * *"   # every 3 days, 02:17 UTC (09:17 Bangkok)
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # needed by the "keep this workflow enabled" step

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: jkvpasfaacvxpazjtfrt
      # Same public URL + publishable key embedded in index.html (safe with RLS).
      SUPABASE_URL: https://jkvpasfaacvxpazjtfrt.supabase.co
      SUPABASE_KEY: sb_publishable_bqD3b_ro947ZSyeBxMs_-g_kDZfYY_p
    steps:
      # GitHub disables scheduled workflows in public repos after 60 days with
      # no repository activity. This app gets no commits for months at a time,
      # so re-enable the workflow on every run to keep the schedule alive.
      - name: Keep this workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"

      - name: Restore project if paused
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret is not set - auto-restore is disabled."
            exit 0
          fi
          api="https://api.supabase.com/v1/projects/$PROJECT_REF"

          # Prints the project status on stdout; diagnostics go to stderr so
          # they show in the log instead of being captured by $(...).
          get_status() {
            code=$(curl -sS --retry 3 --retry-delay 5 -o proj.json -w '%{http_code}' \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api")
            if [ "$code" != "200" ]; then
              echo "::error::Supabase Management API returned HTTP $code - check that SUPABASE_ACCESS_TOKEN is valid." >&2
              cat proj.json >&2; echo >&2
              return 1
            fi
            jq -r '.status' proj.json
          }

          status=$(get_status) || exit 1
          echo "project status: $status"
          restored=no
          # Up to ~8 minutes for a paused project to come back.
          for i in $(seq 1 48); do
            [ "$status" = "ACTIVE_HEALTHY" ] && break
            if [ "$status" = "INACTIVE" ] && [ "$restored" = "no" ]; then
              echo "::warning::Project was paused - restoring it now."
              code=$(curl -sS --retry 3 --retry-delay 5 -o restore.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api/restore")
              echo "restore request: HTTP $code"
              cat restore.json; echo
              case "$code" in
                200|201|202|204) restored=yes ;;
                *) echo "::error::Restore request failed (HTTP $code)"; exit 1 ;;
              esac
            fi
            sleep 10
            status=$(get_status) || exit 1
            echo "project status: $status"
          done
          if [ "$status" != "ACTIVE_HEALTHY" ]; then
            echo "::error::Project is not healthy (status: $status). Check the Supabase dashboard."
            exit 1
          fi

      # Right after a restore the REST API returns 5xx/404 for a couple of
      # minutes, so keep retrying for up to ~4 minutes before failing.
      - name: Read config table
        run: |
          for i in $(seq 1 24); do
            status=$(curl -sS --retry 3 --retry-delay 10 -o body.json -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/config?select=key&limit=1" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY") || status=000
            echo "HTTP $status"
            [ "$status" = "200" ] && break
            sleep 10
          done
          cat body.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not respond with 200 - the project may be paused. Restore it in the Supabase dashboard."
            exit 1
          fi

      # A read alone did not stop the project from pausing (it was INACTIVE
      # the day after a successful read), so also write a heartbeat row.
      - name: Write heartbeat row
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          status=$(curl -sS --retry 3 --retry-delay 10 -o body.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/config?on_conflict=key" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"key\":\"keepalive\",\"data\":{\"at\":\"$now\"}}")
          echo "HTTP $status"
          cat body.json; echo
          case "$status" in
            200|201|204) ;;
            *) echo "::error::Heartbeat write failed (HTTP $status)"; exit 1 ;;
          esac
